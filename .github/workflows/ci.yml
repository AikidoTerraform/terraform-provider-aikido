name: Pull

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: standard-runner-no-rights-public-ip
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go build -v .

  unit:
    name: Unit Tests
    needs: build
    runs-on: standard-runner-no-rights-public-ip
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -v -cover -timeout=120s -parallel=10 ./...

  lint:
    name: Lint
    runs-on: standard-runner-no-rights-public-ip
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest

  docs:
    name: Docs Generation
    runs-on: standard-runner-no-rights-public-ip
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - name: Generate docs
        run: cd tools && go generate ./...
      - name: Verify generated docs are committed
        run: |
          git diff --exit-code || \
            (echo; echo "Unexpected difference after docs generation. Run 'cd tools && go generate ./...' and commit."; exit 1)
